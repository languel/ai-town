# Build the fully-local (no Convex) app and push dist/ to the gh-pages branch.
# Arena pins this session to arena/01a0aae7-ai-town; aitownarena is listed so a
# later rename of the GitHub branch keeps deploying.
#
# After the first successful run, turn Pages on once:
#   Settings → Pages → Deploy from a branch → gh-pages / (root)
# Then the town is at https://languel.github.io/ai-town/
name: aitownarena pages

on:
  push:
    branches:
      - arena/01a0aae7-ai-town
      - aitownarena
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: SPA fallback + skip Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
